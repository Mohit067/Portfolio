services:
  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: mohit-portfolio-agent
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - path: ./ai-agent/.env
        required: false
    environment:
      - AGENT_PORT=8001
      - AGENT_HOST=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mohit-portfolio-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - AGENT_URL=http://ai-agent:8001
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      ai-agent:
        condition: service_healthy
